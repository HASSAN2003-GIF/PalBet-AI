<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAL-PREDICT: football win chances and value prices</title>
    <meta name="description" content="PAL-PREDICT turns market odds into football win chances, most likely scores and value prices, with an honest public track record." />
    <meta name="application-name" content="PAL-PREDICT" />
    <meta name="apple-mobile-web-app-title" content="PAL-PREDICT" />
    <meta property="og:site_name" content="PAL-PREDICT" />
    <meta property="og:title" content="PAL-PREDICT: football win chances and value prices" />
    <meta name="theme-color" content="#F1F3EE" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Theme before first paint (no flash): a saved choice wins, otherwise follow the system.
      // Kept in step with resources/js/lib/theme.js.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('pp_theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0D1411');
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/resources/css/app.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/resources/js/app.jsx"></script>
  </body>
</html>
